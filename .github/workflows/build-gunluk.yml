name: APK derle (Gunluk)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Projeyi zip'ten cikar
        run: unzip -q Gunluk-android.zip -d proj

      - name: AndroidX ayarini zorla ac
        run: |
          echo "android.useAndroidX=true" >> proj/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g" >> proj/gradle.properties

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: APK'yi yukle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Gunluk-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gunluk-v${{ github.run_number }}" \
            proj/app/build/outputs/apk/debug/app-debug.apk \
            --title "Gunluk v${{ github.run_number }}" \
            --notes "Debug APK"
